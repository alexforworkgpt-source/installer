name: Dispatch release 2026.08.1

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publication workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-release-bundle.yml \
            --repo alexforworkgpt-source/installer \
            --ref main \
            -f release=2026.08.1 \
            -f installer_tag=v2026.08.1 \
            -f bot_repository=https://github.com/BEDOLAGA-DEV/remnawave-bedolaga-telegram-bot.git \
            -f bot_ref=v4.0.0 \
            -f cabinet_repository=https://github.com/BEDOLAGA-DEV/bedolaga-cabinet.git \
            -f cabinet_ref=v1.65.0 \
            -f postgres_image=postgres@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23 \
            -f redis_image=redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 \
            -f node_builder_image=node@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 \
            -f nginx_runtime_image=nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
