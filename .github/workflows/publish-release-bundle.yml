name: Publish Release Bundle

on:
  workflow_dispatch:
    inputs:
      release:
        description: Bundle version, for example 2026.10.01.1
        required: true
        type: string
      installer_tag:
        description: Existing Installer source tag, for example installer-v2026.10.01
        required: true
        type: string
      installer_sha:
        description: Exact Installer source commit (40 lowercase hex)
        required: true
        type: string
      bundle_tag:
        description: Existing Bundle tag on the same commit, for example bundle-v2026.10.01.1
        required: true
        type: string
      bot_ref:
        description: Bot tag, branch or SHA to resolve
        required: true
        type: string
      cabinet_repository:
        description: Public Cabinet Git repository
        required: true
        default: https://github.com/alexforworkgpt-source/custom-cabinet.git
        type: string
      cabinet_ref:
        description: Cabinet tag, branch or SHA to resolve
        required: true
        default: 49d4bbaf2b87244f8080d65cc404ad5ef78d2dea
        type: string
      postgres_image:
        description: PostgreSQL image pinned by sha256 digest
        required: true
        type: string
      redis_image:
        description: Redis image pinned by sha256 digest
        required: true
        type: string
      node_builder_image:
        description: Node builder image pinned by sha256 digest
        required: true
        type: string
      nginx_runtime_image:
        description: Nginx runtime image pinned by sha256 digest
        required: true
        type: string
      lifecycle_evidence_sha:
        description: Exact reviewed evidence commit on the default branch
        required: true
        type: string
      lifecycle_evidence_path:
        description: Public lifecycle JSON under releases/evidence/ in that commit
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publication-${{ inputs.bundle_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production-release
    env:
      RELEASE_NAME: ${{ inputs.release }}
      INSTALLER_TAG: ${{ inputs.installer_tag }}
      INSTALLER_SHA: ${{ inputs.installer_sha }}
      BUNDLE_TAG: ${{ inputs.bundle_tag }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PYTHONDONTWRITEBYTECODE: '1'
      BOT_REPOSITORY: https://github.com/BEDOLAGA-DEV/remnawave-bedolaga-telegram-bot.git
      BOT_REF: ${{ inputs.bot_ref }}
      CABINET_REPOSITORY: ${{ inputs.cabinet_repository }}
      CABINET_REF: ${{ inputs.cabinet_ref }}
      POSTGRES_IMAGE: ${{ inputs.postgres_image }}
      REDIS_IMAGE: ${{ inputs.redis_image }}
      NODE_BUILDER_IMAGE: ${{ inputs.node_builder_image }}
      NGINX_RUNTIME_IMAGE: ${{ inputs.nginx_runtime_image }}
      LIFECYCLE_EVIDENCE_SHA: ${{ inputs.lifecycle_evidence_sha }}
      LIFECYCLE_EVIDENCE_PATH: ${{ inputs.lifecycle_evidence_path }}
    steps:
      - name: Checkout exact installer tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.installer_tag }}

      - name: Verify exact source and reserve a new Bundle identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/publication_control.py source \
            --source "${RUNNER_TEMP}/installer-source.json" \
            --archive "${RUNNER_TEMP}/installer-source.tar.gz"
          python3 scripts/publication_control.py check-release
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["CABINET_REPOSITORY"]
          try:
              parts = urlsplit(value)
              port = parts.port
          except ValueError as error:
              raise SystemExit(f"Invalid Cabinet repository URL: {error}") from error

          if (
              value != value.strip()
              or any(character.isspace() for character in value)
              or parts.scheme != "https"
              or parts.hostname != "github.com"
              or not parts.path.strip("/")
              or parts.username is not None
              or parts.password is not None
              or parts.query
              or parts.fragment
              or port not in (None, 443)
          ):
              raise SystemExit("Cabinet repository must be a public GitHub HTTPS URL without credentials")
          PY

      - name: Run release contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run-release-contract-tests.sh

      - name: Verify runtime digests on linux/amd64
        shell: bash
        run: python3 scripts/publication_control.py images

      - name: Resolve immutable source revisions
        id: revisions
        shell: bash
        run: |
          set -Eeuo pipefail
          bot_sha="$(python3 lib/release_bundle.py resolve-ref "${BOT_REPOSITORY}" "${BOT_REF}")"
          cabinet_sha="$(python3 lib/release_bundle.py resolve-ref "${CABINET_REPOSITORY}" "${CABINET_REF}")"
          printf 'bot_sha=%s\n' "${bot_sha}" >> "${GITHUB_OUTPUT}"
          printf 'cabinet_sha=%s\n' "${cabinet_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build deterministic Cabinet artifact
        env:
          CABINET_SHA: ${{ steps.revisions.outputs.cabinet_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          bash scripts/build-cabinet-release-artifact.sh \
            "${CABINET_REPOSITORY}" \
            "${CABINET_SHA}" \
            release-assets/cabinet-dist.tar.gz \
            "${PWD}" \
            "${NODE_BUILDER_IMAGE}" \
            "${NGINX_RUNTIME_IMAGE}"
          bash scripts/build-cabinet-release-artifact.sh \
            "${CABINET_REPOSITORY}" \
            "${CABINET_SHA}" \
            release-assets/cabinet-dist-second.tar.gz \
            "${PWD}" \
            "${NODE_BUILDER_IMAGE}" \
            "${NGINX_RUNTIME_IMAGE}"
          cmp release-assets/cabinet-dist.tar.gz release-assets/cabinet-dist-second.tar.gz
          rm -f release-assets/cabinet-dist-second.tar.gz
          (cd release-assets && sha256sum cabinet-dist.tar.gz > cabinet-dist.tar.gz.sha256)
          jq -n \
            --arg cabinet_repository "${CABINET_REPOSITORY}" \
            --arg cabinet_sha "${CABINET_SHA}" \
            --arg node_builder_image "${NODE_BUILDER_IMAGE}" \
            --arg nginx_runtime_image "${NGINX_RUNTIME_IMAGE}" \
            '{cabinet_repository: $cabinet_repository, cabinet_sha: $cabinet_sha, node_builder_image: $node_builder_image, nginx_runtime_image: $nginx_runtime_image}' \
            > release-assets/release-provenance.json

      - name: Create and validate manifest
        env:
          INSTALLER_REPOSITORY: ${{ github.repository }}
          BOT_SHA: ${{ steps.revisions.outputs.bot_sha }}
          CABINET_SHA: ${{ steps.revisions.outputs.cabinet_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_sha256="$(sha256sum release-assets/cabinet-dist.tar.gz | cut -d ' ' -f 1)"
          python3 scripts/release_bundle_publication.py create-manifest \
            --output release-assets/release.json \
            --release "${RELEASE_NAME}" \
            --installer-repository "${INSTALLER_REPOSITORY}" \
            --installer-tag "${INSTALLER_TAG}" \
            --bundle-tag "${BUNDLE_TAG}" \
            --bot-repository "${BOT_REPOSITORY}" \
            --bot-sha "${BOT_SHA}" \
            --cabinet-repository "${CABINET_REPOSITORY}" \
            --cabinet-sha "${CABINET_SHA}" \
            --artifact-sha256 "${artifact_sha256}" \
            --postgres-image "${POSTGRES_IMAGE}" \
            --redis-image "${REDIS_IMAGE}" \
            --migration-policy rollback-compatible
          python3 lib/release_bundle.py validate release-assets/release.json 1 >/dev/null
          python3 lib/release_bundle.py verify-cabinet \
            release-assets/cabinet-dist.tar.gz "${artifact_sha256}"

      - name: Verify reviewed lifecycle evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          python3 scripts/publication_control.py evidence \
            --source "${RUNNER_TEMP}/installer-source.json" \
            --manifest release-assets/release.json

      - name: Package verified Installer source
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "${RUNNER_TEMP}/installer-source.tar.gz" "release-assets/installer-${RELEASE_NAME}.tar.gz"
          (cd release-assets && \
            sha256sum "installer-${RELEASE_NAME}.tar.gz" \
              > "installer-${RELEASE_NAME}.tar.gz.sha256")

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'Release Bundle %s candidate. Installer %s (%s). Lifecycle evidence: %s at %s. Stable promotion is a separate gate.\n' \
            "${RELEASE_NAME}" "${INSTALLER_TAG}" "${INSTALLER_SHA}" \
            "${LIFECYCLE_EVIDENCE_PATH}" "${LIFECYCLE_EVIDENCE_SHA}" > "${RUNNER_TEMP}/release-notes.txt"
          python3 scripts/publication_control.py create-draft \
            --receipt "${RUNNER_TEMP}/publication-receipt.json" --notes "${RUNNER_TEMP}/release-notes.txt"
          python3 scripts/publication_control.py upload-assets \
            --receipt "${RUNNER_TEMP}/publication-receipt.json" --assets release-assets

      - name: Download and verify published draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          CABINET_SHA: ${{ steps.revisions.outputs.cabinet_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/publication_control.py download-assets \
            --receipt "${RUNNER_TEMP}/publication-receipt.json" --assets downloaded-assets
          python3 scripts/release_bundle_publication.py verify-download \
            --expected release-assets --downloaded downloaded-assets --release "${RELEASE_NAME}"
          diff release-assets/release.json downloaded-assets/release.json
          diff release-assets/release-provenance.json downloaded-assets/release-provenance.json
          jq -e \
            --arg cabinet_repository "${CABINET_REPOSITORY}" \
            --arg cabinet_sha "${CABINET_SHA}" \
            --arg node_builder_image "${NODE_BUILDER_IMAGE}" \
            --arg nginx_runtime_image "${NGINX_RUNTIME_IMAGE}" \
            'type == "object"
              and keys == ["cabinet_repository", "cabinet_sha", "nginx_runtime_image", "node_builder_image"]
              and .cabinet_repository == $cabinet_repository
              and .cabinet_sha == $cabinet_sha
              and .node_builder_image == $node_builder_image
              and .nginx_runtime_image == $nginx_runtime_image' \
            downloaded-assets/release-provenance.json
          (cd downloaded-assets && sha256sum --check cabinet-dist.tar.gz.sha256)
          (cd downloaded-assets && \
            sha256sum --check "installer-${RELEASE_NAME}.tar.gz.sha256")

      - name: Publish verified Bundle candidate (never latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/publication_control.py publish-draft \
            --receipt "${RUNNER_TEMP}/publication-receipt.json"

      - name: Remove failed workflow draft
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/publication_control.py cleanup-draft \
            --receipt "${RUNNER_TEMP}/publication-receipt.json"
