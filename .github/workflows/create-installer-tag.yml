name: Create installer tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable installer tag
        shell: bash
        run: |
          set -Eeuo pipefail
          target=cae0267b2e9b000e6273dfcdaad73c67768b8bec
          test "$(git rev-parse "${target}^{commit}")" = "${target}"
          if git ls-remote --exit-code --tags origin refs/tags/v2026.08.0; then
            printf '%s\n' 'Tag already exists.' >&2
            exit 1
          fi
          git tag v2026.08.0 "${target}"
          git push origin refs/tags/v2026.08.0
