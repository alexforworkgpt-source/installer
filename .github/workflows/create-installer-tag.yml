name: Create installer v2026.08.1 tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: a2c5515f649c60d8786c4d95500c33eeb5483903
          TAG_NAME: v2026.08.1
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG_NAME}" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            test "$existing" = "$TARGET_SHA"
            exit 0
          fi
          gh api --method POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${TAG_NAME}" -f "sha=${TARGET_SHA}"
